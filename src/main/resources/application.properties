# Configurações da Aplicação
server.port=8080
spring.application.name=stock-manager-backend
server.servlet.context-path=/stock-manager-backend

# Configurações do Banco MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

# Configurações do JPA/Hibernate
# O dialeto SQL (MySQL, PostgreSQL...) é detectado automaticamente pelo Hibernate 6
# (MySQL8Dialect está obsoleto; não é preciso declarar o dialeto)

# ddl-auto=update: o Hibernate altera as tabelas sozinho. Use SÓ em desenvolvimento!
# Em produção use validate (ou none) e versione o esquema com migrations (Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações de Pool de Conexão
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Log Level
logging.level.org.hibernate.SQL=DEBUG
# Valores dos parâmetros das queries (Hibernate 6; no Hibernate 5 era ...type.descriptor.sql.BasicBinder)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
